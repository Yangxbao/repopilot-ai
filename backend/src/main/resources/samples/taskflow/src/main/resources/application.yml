# 演示数据：数据库连接参数配置在这里（体验问答："数据库连接配置在哪里？"）

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/taskflow?useUnicode=true&characterEncoding=utf8
    username: taskflow
    password: ${TASKFLOW_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 连接池配置
  hikari:
    maximum-pool-size: 10
    minimum-idle: 2

server:
  port: 8081
